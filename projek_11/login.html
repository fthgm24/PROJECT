<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Sistem Keuangan</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="simple-login-body">

  <main class="simple-login-container">
    
    <!-- Minimalist Auth Card -->
    <div class="simple-auth-card">
      
      <!-- Brand Header -->
      <div class="simple-brand-header">
        <div class="simple-brand-icon">📸</div>
        <h1 class="simple-brand-title">Sistem Keuangan</h1>
        <p class="simple-brand-subtitle">Sistem Manajemen Keuangan Usaha</p>
      </div>

      <!-- Tabs Switcher -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">🔑 Masuk</button>
        <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">📝 Daftar Usaha</button>
      </div>

      <!-- FORM MASUK (LOGIN) -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Username / Email</label>
          <div class="form-input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="loginEmail" class="form-input" placeholder="nama atau email@usaha.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="form-input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat Saya</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link" onclick="openResetModal()">Lupa Password?</a>
        </div>

        <button type="submit" class="submit-btn" id="loginSubmitBtn">
          <span>Masuk ke Dashboard</span>
          <span>➔</span>
        </button>

        <div class="auth-switch-link">
          Baru di Sistem Keuangan? <a href="javascript:void(0)" onclick="switchTab('register')">Daftar</a>
        </div>
      </form>

      <!-- FORM DAFTAR (REGISTER) -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Nama Pemilik</label>
          <div class="form-input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="regName" class="form-input" placeholder="Budi Santoso" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regBoothName">Nama Usaha</label>
          <div class="form-input-wrapper">
            <span class="input-icon">📷</span>
            <input type="text" id="regBoothName" class="form-input" placeholder="Usaha Saya" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Usaha</label>
          <div class="form-input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" class="form-input" placeholder="info@usaha.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="form-input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" class="form-input" placeholder="Minimal 6 karakter" minlength="6" required>
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="submit-btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
          <span>Daftar Usaha Baru</span>
          <span>✨</span>
        </button>

        <div class="auth-switch-link">
          Sudah punya akun? <a href="javascript:void(0)" onclick="switchTab('login')">Log in</a>
        </div>
      </form>

    </div>

  </main>

  <!-- MODAL LUPA PASSWORD -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">🔑 Pulihkan Password</h3>
        <button class="close-modal-btn" onclick="closeResetModal()">&times;</button>
      </div>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5;">
        Masukkan alamat email terdaftar Anda untuk mengatur ulang password akun.
      </p>
      <form onsubmit="handleResetSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Terdaftar</label>
          <div class="form-input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="resetEmail" class="form-input" placeholder="email@usaha.com" required>
          </div>
        </div>
        <button type="submit" class="submit-btn" style="margin-top: 12px;">
          Kirim Link Reset Password
        </button>
      </form>
    </div>
  </div>

  <div id="toastContainer"></div>
  <script src="js/login.js"></script>
</body>
</html>
